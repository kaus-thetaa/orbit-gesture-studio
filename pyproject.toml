[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-gesture-studio"
version = "0.3.2"
description = "Webcam-powered, customizable gesture control for your desktop (hand gestures, optional gaze/face signals)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.30,<2",
    "opencv-contrib-python>=4.8",
    "numpy>=1.26",
    "PySide6>=6.6",
    "pynput>=1.7.6",
    "pulsectl>=23.5; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
