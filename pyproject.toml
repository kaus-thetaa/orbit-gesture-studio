[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-gesture-studio"
version = "0.4.0"
description = "Webcam-powered, customizable hand and motion gesture control for your desktop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "mediapipe>=0.10.30,<2",
    "opencv-contrib-python>=4.8",
    "numpy>=1.26",
    "PySide6>=6.6",
    "pynput>=1.7.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
